<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="auth-page">
  <div style="position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0">
    <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(79,126,248,.14),transparent 70%);top:-80px;right:-80px"></div>
    <div style="position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(244,114,182,.12),transparent 70%);bottom:-60px;left:-60px"></div>
  </div>

  <div class="auth-card" style="position:relative;z-index:1">
    <a class="auth-logo" href="../index.html">Pulse ✨</a>
    <h1 class="auth-title">Welcome back!</h1>
    <p class="auth-sub">Sign in to see what's happening</p>

    <div id="err-msg" class="alert alert-error" style="display:none"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input class="form-input" id="f-user" type="text" placeholder="johndoe"
               autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="f-pass" type="password" placeholder="••••••"
               autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="submit-btn"
              style="padding:.75rem;font-size:1rem">Sign In</button>
    </form>

    <div class="auth-switch">
      No account? <a href="register.html">Create one →</a>
    </div>
  </div>
</div>

<div id="toast-wrap"></div>
<script src="../js/app.js"></script>
<script>
// Redirect if already logged in
if (Auth.loggedIn) goTo('feed.html');

document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var err = document.getElementById('err-msg');
  var btn = document.getElementById('submit-btn');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    var data = await apiPost('/auth/login', {
      username: document.getElementById('f-user').value.trim(),
      password: document.getElementById('f-pass').value
    });
    Auth.set(data.token, data.user);
    toast('Welcome back, ' + (data.user.full_name || data.user.username) + '! 👋', 'success');
    setTimeout(function() { goTo('feed.html'); }, 500);
  } catch (ex) {
    err.textContent = ex.error || 'Login failed. Check your credentials.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
